<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Markdown Editor</title>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <!-- Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #d0d7de;
            --toolbar-bg: #f6f8fa;
            --text-color: #24292f;
            --accent-color: #0969da;
            --pre-bg: #f6f8fa;
            --code-bg: rgba(175, 184, 193, 0.2);
            --link-color: #0969da;
        }

        [data-theme="dark"], body:not([data-theme="light"]) {
            --bg-color: #0d1117;
            --border-color: #30363d;
            --toolbar-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --pre-bg: #161b22;
            --code-bg: rgba(110, 118, 129, 0.4);
            --link-color: #58a6ff;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Ensure dark theme by default if no attribute is set */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Link styling */
        .markdown-body a {
            color: var(--link-color);
            text-decoration: none;
        }
        
        .markdown-body a:hover {
            text-decoration: underline;
        }

        /* Toolbar Styles */
        .toolbar {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            border-right: 1px solid var(--border-color);
            padding-right: 8px;
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-btn {
            background: none;
            border: 1px solid transparent;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background-color: rgba(175, 184, 193, 0.2);
            border-color: var(--border-color);
        }

        .toolbar-btn i {
            width: 18px;
            height: 18px;
        }

        .toolbar-spacer {
            flex: 1;
        }

        /* Main Content Layout */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            height: 100%;
            overflow: auto;
            position: relative;
        }

        #editor-pane {
            border-right: 1px solid var(--border-color);
        }

        /* CodeMirror Overrides */
        .CodeMirror {
            height: 100% !important;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
            background: transparent !important;
            color: inherit !important;
        }

        .cm-s-neo.CodeMirror { color: var(--text-color); }
        [data-theme="dark"] .cm-s-neo.CodeMirror { 
            color: #c9d1d9; 
        }
        /* Minimal dark mode for CodeMirror neo theme */
        [data-theme="dark"] .CodeMirror-gutters { background: #0d1117; border-right: 1px solid #30363d; }
        [data-theme="dark"] .CodeMirror-linenumber { color: #6e7681; }

        /* Preview Styles (GitHub-like) */
        #preview-pane {
            padding: 32px;
            background-color: var(--bg-color);
        }

        .markdown-body {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .markdown-body code { background-color: var(--code-bg); padding: 0.2em 0.4em; border-radius: 6px; font-family: monospace; }
        .markdown-body pre { background-color: var(--pre-bg); padding: 16px; border-radius: 6px; overflow: auto; }
        .markdown-body pre code { background: none; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid var(--border-color); color: #8b949e; padding-left: 16px; margin: 0; }
        .markdown-body img { max-width: 100%; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 6px 13px; }
        .markdown-body tr:nth-child(even) { background-color: var(--pre-bg); }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            #editor-pane { border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="h1" title="Heading 1"><i data-lucide="heading-1"></i></button>
            <button class="toolbar-btn" data-command="h2" title="Heading 2"><i data-lucide="heading-2"></i></button>
            <button class="toolbar-btn" data-command="h3" title="Heading 3"><i data-lucide="heading-3"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="bold" title="Bold"><i data-lucide="bold"></i></button>
            <button class="toolbar-btn" data-command="italic" title="Italic"><i data-lucide="italic"></i></button>
            <button class="toolbar-btn" data-command="strikethrough" title="Strikethrough"><i data-lucide="strikethrough"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="quote" title="Quote"><i data-lucide="quote"></i></button>
            <button class="toolbar-btn" data-command="code" title="Inline Code"><i data-lucide="code"></i></button>
            <button class="toolbar-btn" data-command="code-block" title="Code Block"><i data-lucide="terminal"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="link" title="Link"><i data-lucide="link"></i></button>
            <button class="toolbar-btn" data-command="image" title="Image"><i data-lucide="image"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="ul" title="Unordered List"><i data-lucide="list"></i></button>
            <button class="toolbar-btn" data-command="ol" title="Ordered List"><i data-lucide="list-ordered"></i></button>
            <button class="toolbar-btn" data-command="task" title="Task List"><i data-lucide="check-square"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="table" title="Table"><i data-lucide="table"></i></button>
        </div>
        
        <div class="toolbar-spacer"></div>

        <div class="toolbar-group">
            <button class="toolbar-btn" id="copy-btn" title="Copy Markdown"><i data-lucide="copy"></i></button>
            <button class="toolbar-btn" id="theme-btn" title="Toggle Dark Mode"><i data-lucide="moon"></i></button>
        </div>
    </header>

    <main class="main-content">
        <div id="editor-pane" class="pane">
            <textarea id="markdown-input"></textarea>
        </div>
        <div id="preview-pane" class="pane">
            <div id="preview-content" class="markdown-body"></div>
        </div>
    </main>
</div>

<!-- Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

<script>
    // Initialize Icons
    lucide.createIcons();

    // Elements
    const textarea = document.getElementById('markdown-input');
    const previewContent = document.getElementById('preview-content');
    const previewPane = document.getElementById('preview-pane');
    const themeBtn = document.getElementById('theme-btn');
    const copyBtn = document.getElementById('copy-btn');

    // Theme Toggle
    themeBtn.addEventListener('click', () => {
        const isDark = document.body.dataset.theme === 'dark';
        document.body.dataset.theme = isDark ? 'light' : 'dark';
        themeBtn.innerHTML = `<i data-lucide="${isDark ? 'moon' : 'sun'}"></i>`;
        lucide.createIcons();
        
        // Switch Highlight.js style
        const hlStyle = document.querySelector('link[href*="highlight.js"]');
        if (isDark) {
            hlStyle.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css";
        } else {
            hlStyle.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css";
        }
    });

    // Copy Button
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(editor.getValue()).then(() => {
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i data-lucide="check" style="color: green"></i>';
            lucide.createIcons();
            setTimeout(() => {
                copyBtn.innerHTML = originalIcon;
                lucide.createIcons();
            }, 2000);
        });
    });

    // Initialize CodeMirror
    const editor = CodeMirror.fromTextArea(textarea, {
        mode: 'markdown',
        theme: 'neo',
        lineNumbers: true,
        lineWrapping: true,
        extraKeys: {"Enter": "newlineAndIndentContinueMarkdownList"}
    });

    // Default Content
    const initialContent = `# Welcome to the Interactive Markdown Editor!

This is a **live preview** editor. Try typing something here...

## Features:
- [x] Live Preview
- [x] Syntax Highlighting
- [x] Formatting Toolbar
- [x] Synchronized Scrolling
- [x] Dark Mode support

\`\`\`javascript
function hello() {
  console.log("Hello, Markdown!");
}
hello();
\`\`\`

> "Markdown is a lightweight markup language for creating formatted text using a plain-text editor."
`;
    editor.setValue(initialContent);

    // Update Preview
    function updatePreview() {
        const markdownText = editor.getValue();
        const htmlContent = marked.parse(markdownText);
        previewContent.innerHTML = DOMPurify.sanitize(htmlContent);
        
        // Trigger highlight.js for code blocks
        previewContent.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
        });
    }

    // Initial update
    updatePreview();

    // Listen for changes
    editor.on('change', () => {
        updatePreview();
    });

    // Toolbar Actions
    const toolbar = document.getElementById('toolbar');
    toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('.toolbar-btn');
        if (!btn) return;

        const command = btn.dataset.command;
        const selection = editor.getSelection();
        const cursor = editor.getCursor();

        let replacement = '';
        let cursorOffset = 0;

        switch (command) {
            case 'h1': replacement = '# ' + selection; cursorOffset = 2; break;
            case 'h2': replacement = '## ' + selection; cursorOffset = 3; break;
            case 'h3': replacement = '### ' + selection; cursorOffset = 4; break;
            case 'bold': replacement = '**' + (selection || 'bold text') + '**'; cursorOffset = 2; break;
            case 'italic': replacement = '*' + (selection || 'italic text') + '*'; cursorOffset = 1; break;
            case 'strikethrough': replacement = '~~' + (selection || 'strikethrough') + '~~'; cursorOffset = 2; break;
            case 'quote': replacement = '> ' + (selection || 'quote'); cursorOffset = 2; break;
            case 'code': replacement = '`' + (selection || 'code') + '`'; cursorOffset = 1; break;
            case 'code-block': replacement = '```\n' + (selection || 'code block') + '\n```'; cursorOffset = 4; break;
            case 'link': replacement = '[' + (selection || 'link text') + '](https://)'; cursorOffset = selection ? selection.length + 3 : 1; break;
            case 'image': replacement = '![' + (selection || 'alt text') + '](https://)'; cursorOffset = selection ? selection.length + 4 : 2; break;
            case 'ul': replacement = '- ' + (selection || 'list item'); cursorOffset = 2; break;
            case 'ol': replacement = '1. ' + (selection || 'list item'); cursorOffset = 3; break;
            case 'task': replacement = '- [ ] ' + (selection || 'task'); cursorOffset = 6; break;
            case 'table': 
                replacement = '| Header | Header |\n| --- | --- |\n| Cell | Cell |'; 
                cursorOffset = 2;
                break;
        }

        editor.replaceSelection(replacement);
        if (!selection) {
            // Move cursor inside the tags if no selection
             editor.setCursor(cursor.line, cursor.ch + cursorOffset);
        }
        editor.focus();
    });

    // Synchronized Scrolling
    let isScrollingEditor = false;
    let isScrollingPreview = false;

    editor.on('scroll', () => {
        if (isScrollingPreview) return;
        isScrollingEditor = true;

        const scrollInfo = editor.getScrollInfo();
        const scrollPercentage = scrollInfo.top / (scrollInfo.height - scrollInfo.clientHeight);
        
        previewPane.scrollTop = scrollPercentage * (previewPane.scrollHeight - previewPane.clientHeight);

        setTimeout(() => { isScrollingEditor = false; }, 50);
    });

    previewPane.addEventListener('scroll', () => {
        if (isScrollingEditor) return;
        isScrollingPreview = true;

        const scrollPercentage = previewPane.scrollTop / (previewPane.scrollHeight - previewPane.clientHeight);
        const scrollInfo = editor.getScrollInfo();
        
        editor.scrollTo(null, scrollPercentage * (scrollInfo.height - scrollInfo.clientHeight));

        setTimeout(() => { isScrollingPreview = false; }, 50);
    });

</script>

</body>
</html>
